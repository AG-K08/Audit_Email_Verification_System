<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: auto;
      min-width: 420px;
      max-width: 900px;
      height: auto;
      min-height: 200px;
      max-height: none;
      overflow-y: auto;
      resize: both;
    }
    #messageContainer {
      padding: 16px;
      flex: 1;
    }
    .detail-section h3 {
      font-size: 13px;
      color: #fff;
      margin-bottom: 8px;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .btn-pin {
      padding: 6px 12px;
      background: rgba(78, 205, 196, 0.15);
      border: 1px solid rgba(78, 205, 196, 0.3);
      color: #4ecdc4;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-pin:hover {
      background: rgba(78, 205, 196, 0.3);
      color: #fff;
    }

    /* Auth Grid */
    .auth-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .auth-row {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: rgba(255,255,255,.03);
      border-left: 3px solid #555;
    }
    .auth-row.auth-pass  { border-left-color: #2ecc71; background: rgba(46,204,113,.08); }
    .auth-row.auth-fail  { border-left-color: #e74c3c; background: rgba(231,76,60,.08); }
    .auth-row.auth-warn  { border-left-color: #f39c12; background: rgba(243,156,18,.08); }
    .auth-label {
      font-weight: 700;
      color: #ccc;
    }
    .auth-detail {
      color: #888;
      font-size: 11px;
      text-align: right;
    }

    /* Route Chain */
    .route-chain {
      display: flex;
      flex-direction: column;
      padding-left: 4px;
    }
    .route-hop {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .route-dot {
      font-size: 14px;
      line-height: 1;
      margin-top: 2px;
    }
    .route-info {
      flex: 1;
    }
    .route-ip {
      font-weight: 700;
      font-size: 12px;
      color: #e0e0e0;
    }
    .route-geo {
      font-size: 11px;
      color: #aaa;
    }
    .route-host {
      font-size: 10px;
      color: #666;
      font-family: monospace;
    }
    .route-line {
      width: 2px;
      height: 14px;
      background: linear-gradient(to bottom, rgba(233,69,96,.4), rgba(233,69,96,.1));
      margin-left: 8px;
    }

    /* Deep Analysis */
    .deep-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      flex-wrap: wrap;
    }
    .deep-verdict {
      font-weight: 700;
      font-size: 13px;
    }
    .deep-verdict.malicious { color: #e74c3c; }
    .deep-verdict.suspicious { color: #f39c12; }
    .deep-verdict.clean { color: #2ecc71; }

    /* Structured IOC values — each item on its own line */
    .ioc-block .ioc-value {
      font-size: 12px;
      color: #ddd;
      font-family: "Consolas", "Courier New", monospace;
      word-break: break-all;
      white-space: pre-wrap;
      user-select: all;
      line-height: 1.6;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* NIST SP 800-61r2 / SANS PICERL Styles */
    .nist-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .nist-section h3 {
      font-size: 13px;
      font-weight: 700;
      color: #61afef;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
    }
    .nist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin: 6px 0;
    }
    .nist-table th {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
      text-align: left;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nist-table td {
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #ddd;
      vertical-align: top;
    }
    .nist-table tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.015);
    }
    .nist-code {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      color: #e5c07b;
      word-break: break-all;
    }
    .nist-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .nist-badge.clean { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
    .nist-badge.suspicious { background: rgba(243, 156, 18, 0.15); color: #f39c12; border: 1px solid rgba(243, 156, 18, 0.3); }
    .nist-badge.malicious { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
    .mitre-item {
      padding: 4px 8px;
      margin: 4px 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 12px;
      border-left: 3px solid #9b59b6;
    }
    .rec-item {
      padding: 4px 8px;
      margin: 4px 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="logo">
      <span class="shield-icon">🛡️</span>
      <h1>Phishing Guard — Отчёт</h1>
    </div>
    <div class="header-actions" id="headerActions" style="display: none;">
      <button class="btn-pin" id="btnPinWindow" title="Открыть отчёт в отдельном постоянном окне">📌 Открыть в окне</button>
    </div>
  </header>
  <div id="messageContainer">
    <div id="loading" style="text-align: center; padding: 20px; color: #aaa;">Загрузка отчёта...</div>
    <div id="detailContent"></div>
  </div>

  <!-- AI Chat Panel (overlay) -->
  <div id="aiChatPanel" class="detail-panel" style="display:none; flex-direction: column;">
    <div class="detail-header" style="align-items: center;">
      <h2 style="font-size: 14px; color: #9b59b6; display: flex; align-items: center; gap: 6px; margin: 0;">
        💬 ИИ-Ассистент <span id="aiModelName" style="font-size: 10px; color: #888; background: rgba(255,255,255,.05); padding: 2px 6px; border-radius: 4px; font-weight: normal;">(определение модели...)</span>
      </h2>
      <button id="aiChatClose" class="detail-back" style="padding: 4px 10px; font-size: 11px;">Закрыть</button>
    </div>
    <div class="detail-content" style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; margin-top: 10px;">
      <div id="aiChatHistory" style="flex: 1; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.05); border-radius: 6px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
        <!-- Chat messages will be dynamically added here -->
      </div>
      
      <div style="display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.08); border-radius: 6px; padding: 6px;">
        <input type="text" id="aiChatInput" placeholder="Задайте вопрос или попросите запустить скрипт..." style="flex: 1; background: transparent; border: none; color: #fff; font-size: 12px; outline: none; padding: 4px;" autocomplete="off">
        <button id="aiChatSend" class="btn btn-primary" style="flex: none; width: auto; padding: 6px 12px; font-size: 11px; background: linear-gradient(135deg, #8e44ad, #9b59b6); border-radius: 4px;">Отправить</button>
      </div>
    </div>
  </div>

  <script src="message.js"></script>
</body>
</html>
